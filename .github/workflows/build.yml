name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write   # required so the workflow can create a Release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: List actual APK output files (diagnostic)
        run: find app/build/outputs/apk -type f -name "*.apk" || echo "No APK files found at all"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-cal-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            بیلد خودکار از commit: ${{ github.sha }}
            شاخه: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
