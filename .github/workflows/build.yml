name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write   # required so the workflow can create a Release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Decode release keystore (if configured)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/voicecal-release.keystore

      - name: Build signed release APK (if keystore configured)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_PATH: voicecal-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: List actual APK output files (diagnostic)
        run: find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \; || echo "No APK files found at all"

      - name: Compare debug vs release APK contents (diagnostic)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          mkdir -p /tmp/apk-debug /tmp/apk-release
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          unzip -q "$DEBUG_APK" -d /tmp/apk-debug
          unzip -q "$RELEASE_APK" -d /tmp/apk-release
          echo "===== DEBUG APK — top-level folder sizes ====="
          du -sh /tmp/apk-debug/*/ 2>/dev/null | sort -rh
          echo ""
          echo "===== RELEASE APK — top-level folder sizes ====="
          du -sh /tmp/apk-release/*/ 2>/dev/null | sort -rh
          echo ""
          echo "===== lib/ (native libraries) comparison ====="
          echo "-- debug --"; find /tmp/apk-debug/lib -type f -exec ls -lh {} \; 2>/dev/null
          echo "-- release --"; find /tmp/apk-release/lib -type f -exec ls -lh {} \; 2>/dev/null

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-cal-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release with APK(s) attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            بیلد خودکار از commit: ${{ github.sha }}
            شاخه: ${{ github.ref_name }}

            اگر فایل VoiceCal-release.apk موجود است، همان را نصب کنید (امضای واقعی، هشدار کمتر Play Protect).
            VoiceCal-debug.apk فقط برای تست داخلی است.
          prerelease: true
          generate_release_notes: false
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
